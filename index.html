<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#06090E">
  <title>Neuroscape Deck Lab</title>
  <meta name="description" content="Unofficial fan tool: build Neuroscape Genesis decks around their mainframe, find synergies, check legality and share lists.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 2h22v22l-6 6H2V8z' fill='%230D131A' stroke='%2319E3B1' stroke-width='2'/%3E%3Cpath d='M9 22V10h3.5l7 7.5V10H23v12h-3.5l-7-7.5V22z' fill='%23E6EDF3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="bar">
    <a class="brand" href="#/decks" aria-label="Deck Lab, home"><span id="brand-mark"></span><span class="brand-t">Deck Lab</span></a>
    <nav class="nav" aria-label="Sections">
      <a href="#/decks" data-nav="decks">Decks</a>
      <a href="#/mainframes" data-nav="mainframes">Mainframes</a>
      <a href="#/cards" data-nav="cards">Cards</a>
    </nav>
    <div class="gsearch">
      <label class="sr" for="gq">Search all cards by name</label>
      <input id="gq" type="text" placeholder="Search cards" autocomplete="off" spellcheck="false">
      <kbd title="Press / to search">/</kbd>
      <ul id="g-list" class="combo" hidden></ul>
    </div>
    <a id="bar-deck" class="deck-chip" href="#/decks" hidden></a>
    <button id="bar-data" class="bar-btn" data-act="open-mydata">My data</button>
  </header>
  <main id="view" tabindex="-1"></main>
  <footer class="foot"><span>Unofficial fan project, not affiliated with Neuroscape, LLC. Card images, names and text belong to Neuroscape, LLC; the images are loaded from their servers.</span><button class="linkbtn" data-act="open-mydata">My data: tags and backup</button></footer>
  <dialog id="drawer" class="drawer"></dialog>
  <dialog id="lightbox" class="lightbox" aria-label="Enlarged card"></dialog>
  <dialog id="dlg"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
